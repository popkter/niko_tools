name: Build NikoTools

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      verify_plugin:
        description: Run Plugin Verifier against supported IDEs
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nikotools-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test plugin
        run: ./gradlew --no-daemon build
      - name: Verify IDE compatibility
        if: ${{ inputs.verify_plugin == true }}
        run: ./gradlew --no-daemon verifyPlugin
      - name: Generate checksums
        working-directory: build/distributions
        run: |
          for archive in *.zip; do
            sha256sum "$archive" > "$archive.sha256"
          done
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: NikoTools-plugin
          path: build/distributions/*
          if-no-files-found: error
      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: NikoTools-test-reports
          path: |
            build/reports/tests/
            build/test-results/
            build/reports/pluginVerifier/
          if-no-files-found: ignore

  newer-platform-tests:
    name: Test Android Studio platform 253
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test modern terminal API adapter
        run: ./gradlew --no-daemon check -PplatformType=AI -PplatformVersion=2025.3.1.7
      - uses: actions/upload-artifact@v4.6.2
        if: ${{ always() }}
        with:
          name: NikoTools-platform-253-test-reports
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore
