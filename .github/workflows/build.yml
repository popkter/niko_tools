name: Build and Publish NikoTools

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      verify_plugin:
        description: Run Plugin Verifier against supported IDEs
        type: boolean
        default: false

      publish_marketplace:
        description: Publish the current main version to Marketplace (retry only if not already uploaded)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nikotools-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Check release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - name: Test release conditions
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Detect version increase
        id: version
        env:
          PUBLISH_MARKETPLACE: ${{ inputs.publish_marketplace }}
        run: python3 .github/scripts/release_version.py

  build:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test plugin
        run: ./gradlew --no-daemon build
      - name: Verify IDE compatibility
        if: ${{ inputs.verify_plugin == true }}
        run: ./gradlew --no-daemon verifyPlugin
      - name: Generate checksums
        working-directory: build/distributions
        run: |
          for archive in *.zip; do
            sha256sum "$archive" > "$archive.sha256"
          done
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: NikoTools-plugin
          path: build/distributions/*
          if-no-files-found: error
      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: NikoTools-test-reports
          path: |
            build/reports/tests/
            build/test-results/
            build/reports/pluginVerifier/
          if-no-files-found: ignore

  newer-platform-tests:
    name: Test Android Studio platform 253
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test modern terminal API adapter
        run: ./gradlew --no-daemon check -PplatformType=AI -PplatformVersion=2025.3.1.7
      - uses: actions/upload-artifact@v4.6.2
        if: ${{ always() }}
        with:
          name: NikoTools-platform-253-test-reports
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore

  publish:
    name: Publish ${{ needs.version.outputs.version }} to Marketplace
    needs: [version, build, newer-platform-tests]
    if: >-
      needs.version.outputs.publish == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish plugin update
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo '::error::Add the PUBLISH_TOKEN repository secret before publishing.'
            exit 1
          fi
          ./gradlew --no-daemon publishPlugin
